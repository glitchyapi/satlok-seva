<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EEF0F6">
<meta name="author" content="Jagat Guru Rampal Ji Maharaj">
<meta name="description" content="Satlok Seva — simple seva diary and bhandara helper for the sangat.">
<title>Satlok Seva</title>
<link rel="stylesheet" href="css/app.css">
<script>window.__BOOTED=false;window.__bootWatch=setTimeout(function(){if(!window.__BOOTED){try{if(window.SatlokNative){SatlokNative.rollbackWeb();SatlokNative.reloadWeb();}}catch(e){}}},8000);</script>
</head>
<body>
<!-- first-run welcome: clean white, सत साहेब fade in/out -->
<div id="welcome" class="welcome hidden">
  <div class="welcome-text">सत साहेब</div>
</div>

<!-- splash: clean & natural -->
<div id="splash" class="splash">
  <div class="splash-inner">
    <img src="img/logo.png" class="splash-logo" alt="">
    <div class="splash-name">सतलोक सेवा</div>
    <div class="splash-sub">Seva Diary</div>
    <div class="splash-load"><i></i><i></i><i></i></div>
  </div>
</div>

<!-- app lock -->
<div id="lockscreen" class="lockscreen hidden">
  <div class="lock-card">
    <img src="img/logo.png" class="lock-logo" alt="">
    <h2 data-i18n="lock_title">ऐप लॉक</h2>
    <p data-i18n="lock_sub">अपना 4-अंक PIN दर्ज करें</p>
    <div class="pin-dots" id="pinDots"><b></b><b></b><b></b><b></b></div>
    <div class="pin-pad" id="pinPad"></div>
    <button class="link-btn hidden" id="lockForgot" data-i18n="lock_forgot">PIN भूल गए?</button>
  </div>
</div>

<!-- update -->
<div id="updateScreen" class="update-screen hidden">
  <div class="update-card">
    <img src="img/logo.png" class="update-logo" alt="">
    <h2 data-i18n="upd_title">अपडेट उपलब्ध</h2>
    <p id="updateVer" class="update-ver"></p>
    <div id="updateChangelog" class="update-log"></div>
    <div class="update-prog-wrap">
      <div class="update-prog"><i id="updateBar"></i></div>
      <div class="update-status" id="updateStatus">…</div>
    </div>
    <div id="updateFiles" class="update-files"></div>
    <div class="update-actions">
      <button class="btn btn-primary" id="updateNowBtn" data-i18n="upd_now">अपडेट</button>
      <button class="btn btn-ghost hidden" id="updateLaterBtn" data-i18n="upd_later">बाद में</button>
    </div>
  </div>
</div>

<!-- notice -->
<div id="noticeBanner" class="notice-banner hidden"><div class="nb-ico" data-icon="mega"></div><div class="nb-txt"><b id="nbTitle"></b><span id="nbBody"></span></div><button class="nb-x" id="nbClose" data-icon="x"></button></div>

<!-- main -->
<div id="app" class="app hidden">
  <header class="topbar" id="topbar">
    <div class="tb-left"><img src="img/logo.png" class="tb-logo" alt=""><div style="min-width:0"><div class="tb-title" id="tbTitle">सतलोक सेवा</div><div class="tb-sub" id="tbSub"></div></div></div>
    <div class="tb-right">
      <button class="icon-btn" id="langPill" title="Language">हि</button>
      <button class="icon-btn" id="themeBtn" title="Theme"></button>
    </div>
  </header>

  <main class="pages" id="pages">
    <section class="page" data-page="home"></section>
    <section class="page" data-page="seva"></section>
    <section class="page" data-page="bhandara"></section>
    <section class="page" data-page="stats"></section>
    <section class="page" data-page="more"></section>
  </main>

  <nav class="bottomnav" id="bottomnav">
    <button class="nb-item active" data-nav="home"><span class="nb-ic" data-icon="home"></span><span class="nb-lb" data-i18n="nav_home">होम</span></button>
    <button class="nb-item" data-nav="seva"><span class="nb-ic" data-icon="mala"></span><span class="nb-lb" data-i18n="nav_seva">सेवा</span></button>
    <button class="nb-item fab-wrap" data-nav="add"><span class="fab" data-icon="plus"></span></button>
    <button class="nb-item" data-nav="bhandara"><span class="nb-ic" data-icon="bowl"></span><span class="nb-lb" data-i18n="nav_bhandara">भंडारा</span></button>
    <button class="nb-item" data-nav="more"><span class="nb-ic" data-icon="sliders"></span><span class="nb-lb" data-i18n="nav_more">मेनू</span></button>
  </nav>
</div>

<div id="modalRoot" class="modal-root hidden"><div class="modal-back" id="modalBack"></div><div class="modal-sheet" id="modalSheet"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="js/sha256.js"></script>
<script src="js/icons.js"></script>
<script src="js/bridge.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/updater.js"></script>
<script src="js/krikram.js"></script>
<script src="js/screens.js"></script>
<script src="js/screens2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
